name: Dashboard Windows verification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-dashboard:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.419

      - name: Validate generated catalog
        shell: pwsh
        run: |
          node tools/generate_crabsync_coverage_catalog.js --validate
          node tools/generate_crabsync_coverage_catalog.js --self-test

      - name: Build dashboard
        shell: pwsh
        run: dotnet build dashboard/CrabRuntimeProbe.Dashboard.sln -c Release

      - name: Run dashboard tests
        shell: pwsh
        run: dotnet run --project dashboard/tests/CrabRuntimeProbe.Dashboard.Tests/CrabRuntimeProbe.Dashboard.Tests.csproj -c Release

      - name: Run full regression suite
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/run-all-tests.ps1

      - name: Render review screenshots
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "dashboard-screenshots\dashboard-play-guide.png"
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $output) | Out-Null
          dotnet run --project dashboard/src/CrabRuntimeProbe.Dashboard/CrabRuntimeProbe.Dashboard.csproj -c Release -- --screenshot $output

          Add-Type -AssemblyName System.Drawing
          Get-ChildItem -LiteralPath (Split-Path -Parent $output) -Filter "*.png" | ForEach-Object {
            $image = [System.Drawing.Bitmap]::FromFile($_.FullName)
            try {
              if ($image.Width -lt 900 -or $image.Height -lt 620) {
                throw "Screenshot is unexpectedly small: $($_.Name) $($image.Width)x$($image.Height)"
              }
              $points = @(
                [System.Drawing.Point]::new(0, 0),
                [System.Drawing.Point]::new($image.Width - 1, 0),
                [System.Drawing.Point]::new(0, $image.Height - 1),
                [System.Drawing.Point]::new($image.Width - 1, $image.Height - 1)
              )
              foreach ($point in $points) {
                $pixel = $image.GetPixel($point.X, $point.Y)
                if ($pixel.A -ne 255 -or $pixel.R -ne 9 -or $pixel.G -ne 13 -or $pixel.B -ne 22) {
                  throw "Screenshot corner is not opaque page color: $($_.Name) ARGB=$($pixel.A),$($pixel.R),$($pixel.G),$($pixel.B)"
                }
              }
              Write-Host "$($_.Name): $($image.Width)x$($image.Height), opaque dark corners"
            }
            finally {
              $image.Dispose()
            }
          }

      - name: Upload review screenshots
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-review-screenshots
          path: ${{ runner.temp }}/dashboard-screenshots/*.png
          if-no-files-found: error

      # Temporary review transport for environments that can read Actions logs
      # but cannot directly materialize artifact ZIPs. Removed after visual QA.
      - name: Emit screenshot review payloads
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP "dashboard-screenshots") -Filter "*.png" |
            Sort-Object Name |
            ForEach-Object {
              Write-Host "SCREENSHOT_BEGIN:$($_.Name)"
              $payload = [Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName))
              for ($offset = 0; $offset -lt $payload.Length; $offset += 30000) {
                Write-Host $payload.Substring($offset, [Math]::Min(30000, $payload.Length - $offset))
              }
              Write-Host "SCREENSHOT_END:$($_.Name)"
            }
